<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ethnic Touch - Premium Indo-Western Kurthis</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=2">

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Firebase auth for profile state -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    
    <!-- React Router -->
    <script crossorigin src="https://unpkg.com/@remix-run/router@1.16.1/dist/router.umd.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router@6.23.1/dist/umd/react-router.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router-dom@6.23.1/dist/umd/react-router-dom.production.min.js"></script>

    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Razorpay Checkout Integration SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Canvas Confetti for order animations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="debug-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; padding: 20px; background: #fff0f0; color: #b71c1c; border-bottom: 3px solid #b71c1c; font-family: monospace; font-size: 14px; z-index: 100000; box-sizing: border-box; text-align: left;">
        <strong>⚠️ JavaScript/Babel Compilation Error Detected:</strong>
        <pre id="debug-error-msg" style="margin: 10px 0 0; white-space: pre-wrap; word-break: break-all; background: #ffebeb; padding: 10px; border: 1px solid #ffcdd2; borderRadius: 4px; max-height: 300px; overflow-y: auto;"></pre>
        <p style="margin: 10px 0 0; font-size: 12px; color: #555;">Please copy the error trace above and share it with me to fix the page rendering issue.</p>
    </div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            var overlay = document.getElementById('debug-overlay');
            var msg = document.getElementById('debug-error-msg');
            if (overlay && msg) {
                overlay.style.display = 'block';
                msg.textContent += message + ' at ' + source + ':' + lineno + ':' + colno + '\n';
                if (error && error.stack) {
                    msg.textContent += error.stack + '\n';
                }
            }
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            var overlay = document.getElementById('debug-overlay');
            var msg = document.getElementById('debug-error-msg');
            if (overlay && msg) {
                overlay.style.display = 'block';
                msg.textContent += 'Unhandled Promise Rejection: ' + event.reason + '\n';
            }
        });
    </script>
    <div id="root"></div>
    <!-- Modular Application Scripts -->
    <!-- Data & Config -->
    <script type="text/babel" src="./js/data/config.js"></script>
    
    <!-- Components -->
    <script type="text/babel" src="./js/components/CopyButton.js"></script>
    <script type="text/babel" src="./js/components/PremiumAlertModal.js"></script>
    <script type="text/babel" src="./js/components/Navbar.js"></script>
    <script type="text/babel" src="./js/components/Footer.js"></script>
    <script type="text/babel" src="./js/components/ProductCard.js"></script>
    <script type="text/babel" src="./js/components/FilterSidebarContent.js"></script>
    <script type="text/babel" src="./js/components/CustomSelect.js"></script>
    <script type="text/babel" src="./js/components/ScrollToTop.js"></script>
    
    <!-- Pages -->
    <script type="text/babel" src="./js/pages/Shop.js"></script>
    <script type="text/babel" src="./js/pages/Home.js"></script>
    <script type="text/babel" src="./js/pages/WishlistPage.js"></script>
    <script type="text/babel" src="./js/pages/ProductDetails.js"></script>
    <script type="text/babel" src="./js/pages/Cart.js"></script>
    <script type="text/babel" src="./js/pages/Checkout.js"></script>
    <script type="text/babel" src="./js/pages/MockPayment.js"></script>
    <script type="text/babel" src="./js/pages/CheckoutSuccess.js"></script>
    <script type="text/babel" src="./js/pages/ProfilePage.js"></script>

    <!-- Main Entry -->
    <script type="text/babel" src="./app.js"></script>
</body>
</html>
