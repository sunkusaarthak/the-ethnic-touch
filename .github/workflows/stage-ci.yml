name: Stage CI/CD Pipeline - Quality & Automation Enforcement

on:
  push:
    branches:
      - stage
      - main
  pull_request:
    branches:
      - stage

jobs:
  backend-unit-test:
    name: 🧪 Go Backend Unit & Race Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🐹 Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 📦 Download Go Module Dependencies
        run: go mod download

      - name: ⚡ Run Go Backend Unit Tests with Data Race Detector
        run: go test -v -race ./internal/...

  frontend-e2e-test:
    name: 🎭 Playwright Frontend E2E Automation Tests
    runs-on: ubuntu-latest
    needs: backend-unit-test

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: 🎭 Install Playwright Browsers with System Dependencies
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: 🚀 Execute Playwright E2E Automation Test Suite
        working-directory: ./frontend
        run: npm run test:e2e

      - name: 📊 Upload Playwright HTML Report & Failure Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
