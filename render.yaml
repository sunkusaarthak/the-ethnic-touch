services:
  - type: static
    name: the-ethnic-touch-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: https://the-ethnic-touch-backend-j2if.onrender.com/sitemap.xml
      - type: rewrite
        source: /health
        destination: https://the-ethnic-touch-backend-j2if.onrender.com/health
      - type: rewrite
        source: /*
        destination: /index.html
